---
layout: default
---
<article class="post">

  <div class="post-content home-content">
    {% if site.profile_picture %}
      {% include base.html %}
      <div class="profile-block">
        <div class="profile-card">
          <img src="{{ site.profile_picture | prepend: '/' | prepend: base }}"
               class="profile-picture"
               alt="{{ site.author | default: site.title | escape }} profile picture">
          {% include profile-links.html %}
        </div>
      </div>
    {% endif %}
    
    {{ content }}
  </div>

</article>
